<svg xmlns="http://www.w3.org/2000/svg" width="728" height="452" viewBox="0 0 728 452" role="img" aria-label="Validator topology: XRPL peers reach xrpld over a static IP on a bare metal host; xrpld runs under systemd memory limits; a dashboard stack monitors it and exposes a read-only public metrics endpoint. Power chain: utility grid backed by a whole-home Tesla Powerwall 3; an APC UPS bridges the server and a DC UPS bridges the modem, router, and switch through the cutover; rooftop solar with grid-forming Enphase IQ8 microinverters recharges the Powerwall off-grid during extended outages">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#9C9A94"/>
</marker>
</defs>
<rect x="8" y="8" width="718" height="442" rx="18" fill="#0A0A0A"/>
<rect x="2" y="2" width="718" height="442" rx="18" fill="#181818" stroke="#FFFFFF" stroke-width="3"/>
<text x="24" y="34" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#F5F4F1">Topology &#38; monitoring</text>
<text x="24" y="56" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#9C9A94">single-purpose bare metal host &#183; LFG HQ, Ventura CA</text>

<!-- Internet peers -->
<rect x="24" y="96" width="150" height="72" rx="12" fill="#202020" stroke="#2C2C2C" stroke-width="1"/>
<rect x="40" y="108" width="30" height="5" rx="2.5" fill="#4890C0"/>
<text x="40" y="134" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#F5F4F1">XRPL peers</text>
<text x="40" y="152" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9C9A94">mainnet overlay</text>

<!-- Host boundary -->
<rect x="210" y="80" width="496" height="196" rx="14" fill="none" stroke="#2C2C2C" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="226" y="100" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9C9A94">bare metal host &#183; static IP &#183; 800 Mbps</text>

<!-- xrpld -->
<rect x="226" y="112" width="216" height="104" rx="12" fill="#202020" stroke="#D89030" stroke-width="1.5"/>
<rect x="242" y="124" width="30" height="5" rx="2.5" fill="#D89030"/>
<text x="242" y="150" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#F5F4F1">xrpld 3.3.0</text>
<text x="242" y="168" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9C9A94">validating &#183; stock build</text>
<text x="242" y="184" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9C9A94">memory-capped (36G/44G)</text>
<text x="242" y="200" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9C9A94">RPC LAN-only, never public</text>

<!-- monitoring -->
<rect x="470" y="112" width="220" height="88" rx="12" fill="#202020" stroke="#2C2C2C" stroke-width="1"/>
<rect x="486" y="124" width="30" height="5" rx="2.5" fill="#3DA35D"/>
<text x="486" y="150" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#F5F4F1">Monitoring stack</text>
<text x="486" y="168" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9C9A94">dashboard + MOTD checks</text>
<text x="486" y="184" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9C9A94">ledger age &#183; peers &#183; state</text>

<!-- metrics endpoint -->
<rect x="470" y="216" width="220" height="44" rx="12" fill="#202020" stroke="#2C2C2C" stroke-width="1"/>
<text x="486" y="236" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#F5F4F1">/metrics &#183; read-only</text>
<text x="486" y="251" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9C9A94">public health endpoint &#183; TLS</text>

<!-- edges -->
<line x1="174" y1="140" x2="222" y2="146" stroke="#9C9A94" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="180" y="128" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#9C9A94">peers</text>
<line x1="466" y1="185" x2="446" y2="185" stroke="#9C9A94" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="580" y1="200" x2="580" y2="212" stroke="#9C9A94" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Power chain -->
<text x="24" y="308" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#9C9A94">Power chain &#183; utility outage causes no downtime</text>

<!-- Utility grid -->
<rect x="24" y="316" width="118" height="50" rx="12" fill="#202020" stroke="#2C2C2C" stroke-width="1"/>
<text x="40" y="338" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#F5F4F1">Grid</text>
<text x="40" y="354" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9C9A94">utility feed</text>

<!-- Rooftop PV -->
<rect x="24" y="374" width="118" height="50" rx="12" fill="#202020" stroke="#D89030" stroke-width="1.5"/>
<text x="40" y="396" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#F5F4F1">Rooftop PV</text>
<text x="40" y="412" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9C9A94">IQ8 grid-forming</text>

<!-- Powerwall 3 -->
<rect x="178" y="334" width="180" height="72" rx="12" fill="#202020" stroke="#3DA35D" stroke-width="1.5"/>
<rect x="194" y="346" width="30" height="5" rx="2.5" fill="#3DA35D"/>
<text x="194" y="372" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#F5F4F1">Powerwall 3</text>
<text x="194" y="390" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9C9A94">whole-home auto backup</text>

<!-- APC UPS -->
<rect x="394" y="316" width="152" height="60" rx="12" fill="#202020" stroke="#2C2C2C" stroke-width="1"/>
<text x="410" y="338" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#F5F4F1">APC UPS</text>
<text x="410" y="354" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9C9A94">bridges cutover</text>
<text x="410" y="368" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9C9A94">&#8594; validator host</text>

<!-- DC UPS -->
<rect x="554" y="316" width="160" height="60" rx="12" fill="#202020" stroke="#2C2C2C" stroke-width="1"/>
<text x="570" y="338" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#F5F4F1">DC UPS</text>
<text x="570" y="354" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9C9A94">bridges cutover</text>
<text x="570" y="368" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9C9A94">&#8594; modem/router/switch</text>

<!-- power edges -->
<line x1="142" y1="341" x2="174" y2="352" stroke="#9C9A94" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="142" y1="399" x2="174" y2="388" stroke="#9C9A94" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="358" y1="346" x2="390" y2="346" stroke="#9C9A94" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="358" y1="372" x2="550" y2="372" stroke="#9C9A94" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="470" y1="312" x2="470" y2="280" stroke="#9C9A94" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
</svg>
